<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>StudyPilot — AI Study Copilot</title>
    <script type="text/javascript">
      // SPA fallback redirect for GitHub Pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var pathParts = l.pathname.split('/').filter(Boolean);
      var lastPart = pathParts[pathParts.length - 1];
      var validTabs = ['dashboard', 'tutor', 'materials', 'flashcards', 'quizzes', 'exam', 'progress', 'settings', 'privacy'];
      
      if (lastPart && validTabs.indexOf(lastPart.toLowerCase()) !== -1) {
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/studypilot/#' + lastPart.toLowerCase());
      } else {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <p>Redirecting to StudyPilot...</p>
  </body>
</html>
